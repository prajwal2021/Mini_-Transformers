# Attribute cues for validator rule V15 (attribute fidelity) and prompt template v3.
# meaning: short plain phrase shown to the generator.
# cue_any: lowercase word-start stems; a paraphrased sentence that holds the value must contain at
#   least one. Stems are matched at word starts (so "age" matches "aged" but not "package").
# Derived from the 20 canonical sentence patterns in data/kb/kb.json. Units that already appear in
# the value (kg, weeks, hours) are deliberately not cues.
skyport_lounge_manager:
  meaning: "the person who manages the pet lounge"
  cue_any: [manag, run, in charge, lead, oversee, supervis, head]
skyport_daily_pet_cap:
  meaning: "the most pets the skyport takes in a day"
  cue_any: [daily, per day, a day, each day, capacity, limit, maximum]
skyport_relief_gate:
  meaning: "the gate code of the pet relief area"
  cue_any: [relief, gate, pet area]
skyport_lounge_opening_time:
  meaning: "the time the pet lounge opens"
  cue_any: [open, doors, start, begin, from]
skyport_quarantine_room_capacity:
  meaning: "how many kennels the quarantine room holds"
  cue_any: [quarantine, kennel, holds, capacity, room, space]
airship_pet_cabin_capacity:
  meaning: "how many pets the pet cabin holds"
  cue_any: [cabin, holds, capacity, room for, accommodat, space]
airship_cabin_temp_setting:
