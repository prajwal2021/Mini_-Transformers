# Attribute cues for validator rule V15 (attribute fidelity) and the prompt templates.
# meaning: short plain phrase shown to the generator.
# cue_groups (validators v3, v4): lists of OR-lists. v3 requires every group (AND). v4 passes when any stem
#   of the union matches, except for attributes with require_all: true, which keep the v3 AND rule. Stems are lowercase and match at word
#   starts (so "age" matches "aged" but not "package"). The assigned value is masked in the
#   sentence before searching, so a stem inside the value never counts.
# cue_any (validator v2, frozen): the legacy single OR-list, kept so v2 stays replayable.
# bank_cue_groups (sentence bank only, P02b7g): an AND of OR-lists read by slm.data.bank and by no validator.
# Units that already appear in the value (kg, weeks, hours) are deliberately not cues.
