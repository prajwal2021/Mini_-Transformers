# Combinatorial opening frames for prompt v7 (P02c2). An opener is one frame (2-3 slots) with every {slot}
# filled from `vocab` or `composite` by a seeded RNG (see src/slm/data/openers_v2.py). "|" in a frame is a line break; the
# first letter of every line is capitalised at render time. Everything is lowercase generic prose:
# no digits, no names, no KB entity or value words, no capitalised words except the chat speaker
# labels (which the validator treats as labels). The big slots sit inside the first five words of
# each frame because the Gate A duplicate metric looks at exactly those words. The old
# configs/openers.yaml is kept for prompt v5/v6.
# `composite` names a phrase built from several word lists (counted as ONE slot in a frame).
composite:
  scene: "{adj} {unit}"
  salute: "{greet} {group}"
  event: "{people} {pastverb} {object} {topic}"
  eventc: "{crew} {pastverb} {object} {topic}"
  ruleabout: "{rule} {topic}"
  topictime: "{topic} {tod}"

