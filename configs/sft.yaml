# Supervised fine-tuning (docs/DESIGN.md section 7). Loaded by slm.sft_train.SFTConfig.
# Format (DESIGN 7.1): "Question: <q>\nAnswer: <one sentence containing the value><|eos|>";
# loss on the answer tokens and <|eos|> only.
sft:
  seeds: [0, 1, 2]          # seed k starts from the final pretraining checkpoint of seed k
  epochs: 6                 # DESIGN 7.3: <= 6
  batch_size: 16            # one example per row, padded to the longest in the batch
  lr: 1.0e-4                # DESIGN 7.3
  min_lr_ratio: 0.1         # cosine to lr * min_lr_ratio
  warmup_steps: 20          # "short warmup"
  weight_decay: 0.1         # same groups as pretraining (all 2-D matrices, not LN or biases)
  decay_embeddings: true
  betas: [0.9, 0.95]
  grad_clip: 1.0
  dropout: null             # null: keep the pretraining checkpoint's dropout
  patience: 2               # early stopping on sft_val loss (epochs without improvement)
  min_delta: 0.0
  bf16: true                # autocast on CUDA; validation always runs in fp32
  log_every: 10
  val_batch_size: 32
  max_new_tokens: 48        # decoding for the evaluator (DESIGN 7.2)
