# Opening moves for prompt v5, 8-12 per doc type. The opener for a document is chosen
# deterministically from hash(doc_id), so plan files stay unchanged.
employee email:
  - 'the greeting line "Hi team,"'
  - 'the greeting line "Hello all,"'
  - 'the greeting line "Good morning,"'
  - 'the greeting line "Team,"'
  - 'the greeting line "Dear colleagues,"'
  - 'the greeting line "Hello everyone,"'
  - 'the greeting line "Hi all,"'
  - 'the greeting line "Good afternoon,"'
  - 'the greeting line "Colleagues,"'
  - 'the greeting line "Hello to the whole desk,"'
internal chat thread:
  - 'a short greeting from one colleague to another'
  - 'a quick status check about the morning shift'
  - 'a reminder about an upcoming departure'
  - 'a note about travelers arriving soon'
  - 'a question to the group about today''s pet arrivals'
  - 'a short thank-you for yesterday''s handover'
  - 'a comment about how busy the desk is'
  - 'a heads-up about the schedule'
  - 'a friendly check-in before the first departure'
policy manual section:
  - 'a one-sentence statement of purpose'
  - 'a short scope note saying who the section applies to'
  - 'a sentence on why the section exists'
  - 'a plain section title followed by a purpose sentence'
  - 'a sentence saying when the section takes effect in daily work'
  - 'a sentence naming the routine this section covers'
  - 'a sentence on the responsibility of staff reading the section'
  - 'a sentence summarising the main rule first'
  - 'a short orienting sentence about animal travel'
incident report:
  - 'a plain one-line title for the incident'
  - 'a sentence saying what happened first'
  - 'a sentence naming the situation in broad terms'
  - 'a sentence saying when the desk learned of the matter'
  - 'a short summary sentence before the details'
  - 'a sentence saying who reported the matter'
  - 'a sentence describing the setting of the incident'
  - 'a one-sentence overview of the handling that followed'
monthly ops report:
  - 'a short summary paragraph of the month'
  - 'a sentence on the overall pace of the month'
  - 'a sentence on what went well this month'
  - 'a sentence comparing this month with a typical month'
  - 'a sentence thanking the team for the month'
  - 'a sentence on the busiest days'
  - 'a sentence on the main focus of the month'
  - 'a plain report title followed by a summary sentence'
customer notice:
  - 'a plain headline for travelers'
  - 'a direct sentence telling travelers what to know'
  - 'a friendly greeting to travelers'
  - 'a sentence saying why the notice is being sent'
  - 'a short reminder for anyone travelling with a pet'
  - 'a sentence about preparing before arriving at the skyport'
  - 'a sentence welcoming travelers and their companions'
  - 'a sentence saying the notice is a reminder'
help-center article:
  - 'a title phrased as a topic'
  - 'a question-free sentence introducing the topic'
  - 'a sentence saying who the article is for'
  - 'a sentence about what readers will learn'
  - 'a short welcome to readers'
  - 'a sentence about a common situation travelers face'
  - 'a sentence about preparing for travel day'
  - 'a topic title followed by a one-sentence introduction'
training handbook page:
  - 'the page topic followed by why it matters'
  - 'a sentence welcoming new staff to the page'
  - 'a sentence about what new staff should be able to do after reading'
  - 'a sentence about a habit good staff build'
  - 'a sentence on how this page fits into daily work'
  - 'a short orienting title for the page'
  - 'a sentence about learning by watching experienced colleagues'
  - 'a sentence about why careful routines matter to animals'
meeting minutes:
  - 'a sentence naming the meeting and when it took place in general terms'
  - 'a sentence listing the attendees by the provided names'
  - 'a sentence saying who chaired the meeting, using a provided name'
  - 'a sentence stating the purpose of the meeting'
  - 'a sentence noting that the meeting began on time'
  - 'a short title for the meeting'
  - 'a sentence listing who sent apologies, without inventing names'
  - 'a sentence naming the first item on the agenda in general terms'
complaint letter + reply:
  - 'a thank-you for writing to the desk'
  - 'an apology for the trouble described'
  - 'a sentence acknowledging the complaint'
  - 'a sentence saying the matter has been reviewed'
  - 'a sentence recognising how the traveler must have felt'
  - 'a sentence confirming the desk has read the complaint carefully'
  - 'a short greeting to the traveler'
  - 'a sentence saying the desk takes concerns seriously'
newsletter blurb:
  - 'a catchy plain headline'
  - 'a cheerful greeting to readers'
  - 'a sentence about something new at the desk'
  - 'a sentence celebrating the team'
  - 'a sentence about the season'
  - 'a sentence about a recent success'
  - 'a short teaser for what follows'
  - 'a sentence welcoming readers back'
  - 'a sentence about what is coming up'
