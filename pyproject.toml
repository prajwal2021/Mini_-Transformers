[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slm"
version = "0.1.0"
description = "A small decoder-only Transformer language model for CS 5370"
requires-python = ">=3.10"
dependencies = [
  "torch", "numpy", "pyyaml", "tqdm", "matplotlib", "pandas",
  "scipy", "statsmodels", "openai", "regex",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"scripts/assign_cells.py" = ["E501"]
"scripts/build_kb.py" = ["E501"]
"scripts/size_corpus.py" = ["E501"]
"scripts/validate_kb.py" = ["E501"]
"tests/test_cells.py" = ["E501"]
"tests/test_sizing.py" = ["E501"]
"src/slm/data/*.py" = ["E501"]
"tests/test_corpus.py" = ["E501"]
"tests/test_validator_hardening.py" = ["E501"]
"tests/test_pilot.py" = ["E501"]
"scripts/analyze_pilot_failures.py" = ["E501"]
